{# Shared message alerts. Colors are synced to the Django message level tag: success=green, error/danger=red, warning=amber, info=blue. #}
<div class="mb-6 space-y-2" aria-live="polite">
    {% for message in messages %}
    <div class="flex items-start gap-3 rounded-xl border px-4 py-3 text-sm shadow-sm
        {% if 'error' in message.tags or 'danger' in message.tags %}border-rose-200 bg-rose-50 text-rose-700
        {% elif 'warning' in message.tags %}border-amber-200 bg-amber-50 text-amber-800
        {% elif 'info' in message.tags %}border-sky-200 bg-sky-50 text-sky-800
        {% else %}border-emerald-200 bg-emerald-50 text-emerald-800{% endif %}">
        {% if 'error' in message.tags or 'danger' in message.tags %}
        <svg class="mt-0.5 h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        {% else %}
        <span class="mt-1 h-2 w-2 shrink-0 rounded-full
            {% if 'warning' in message.tags %}bg-amber-500
            {% elif 'info' in message.tags %}bg-sky-500
            {% else %}bg-emerald-500{% endif %}"></span>
        {% endif %}
        {{ message }}
    </div>
    {% endfor %}
</div>
