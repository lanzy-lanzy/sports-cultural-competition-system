{# Update-type picker. Include with: selected, aria_label, optional choices and compact=True. #}
<select name="kind" aria-label="{{ aria_label|default:'SMS update type' }}" class="rounded-md border border-slate-200 bg-white font-semibold text-slate-600 transition [color-scheme:dark] hover:border-pine/40 focus:border-pine/50 focus:outline-none focus:ring-2 focus:ring-moss {% if compact %}h-8 max-w-[9.5rem] px-2 text-[11px]{% else %}h-9 px-2.5 text-xs{% endif %}">
    {% for value, label, hint in choices|default:kind_choices %}
    <option class="bg-ink text-white" value="{{ value }}" data-hint="{{ hint }}"{% if selected == value %} selected{% endif %}>{{ label }}</option>
    {% endfor %}
</select>
