<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Account Access{% endblock %} - Competrack</title>
    {% load static %}<script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: {
                    ink: '#15251B',
                    pine: '#116B3B',
                    'pine-deep': '#0C5330',
                    'pine-dark': '#0B3A20',
                    moss: '#EAF2EB',
                    paper: '#F5F7F4',
                    campus: '#116B3B',
                    mist: '#F5F7F4',
                },
                fontFamily: {
                    sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    display: ['"Source Serif 4"', 'Georgia', 'serif'],
                },
            } },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-paper font-sans text-slate-600 antialiased">
    <main class="flex min-h-screen flex-col items-center justify-center px-4 py-10">
        <div class="w-full max-w-lg overflow-hidden rounded-md border border-slate-200 border-t-[3px] border-t-pine bg-white shadow-sm">
            <div class="p-8 sm:p-10">
                <a href="{% url 'landing_page' %}" class="flex items-center gap-3"><span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-slate-200 bg-white p-1"><img src="{% static 'images/jhcsc_logo.png' %}" alt="J.H. Cerilles State College seal" class="h-full w-full rounded-full object-contain"></span><span class="leading-tight"><span class="block font-display text-sm font-semibold text-ink">Competrack</span><span class="block text-[10px] font-medium uppercase tracking-[0.22em] text-slate-400">J.H. Cerilles State College</span></span></a>
                <div class="mt-8">{% block content %}{% endblock %}</div>
            </div>
        </div>
        <p class="mt-6 text-center text-xs text-slate-400">Dumingag Campus &middot; Est. 1954 &middot; Information Technology Department</p>
    </main>
</body>
</html>
