<div class="grid gap-2 sm:grid-cols-2">
{% for entry in entries %}{% if entry.status == 'CONFIRMED' %}
<label class="text-xs font-semibold text-slate-600">Position {{ forloop.counter }}
<select name="order[]" required class="mt-1 block w-full rounded-md border px-3 py-2 text-sm">
{% for candidate in entries %}{% if candidate.status == 'CONFIRMED' %}<option value="{{ candidate.pk }}" {% if candidate.pk == entry.pk %}selected{% endif %}>{{ candidate.display_name }}</option>{% endif %}{% endfor %}
</select></label>
{% endif %}{% endfor %}
</div>
