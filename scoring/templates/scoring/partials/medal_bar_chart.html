{% if series %}
{% with data_id=chart_id|add:'-data' %}
<div class="space-y-4" data-medal-chart-wrapper="{{ chart_id }}">
    <!-- Interactive Graph Controls -->
    <div class="flex flex-wrap items-center justify-between gap-3 rounded-lg border border-slate-200/80 bg-paper/70 px-3.5 py-2.5">
        <!-- Metric mode toggle -->
        <div class="inline-flex rounded-lg border border-slate-200 bg-white p-0.5 shadow-sm" role="group" aria-label="Chart metric">
            <button type="button" data-chart-metric="medals" aria-pressed="true"
                    class="cursor-pointer rounded-md bg-pine px-3 py-1.5 text-xs font-semibold text-white transition">
                Medals (G/S/B)
            </button>
            <button type="button" data-chart-metric="points" aria-pressed="false"
                    class="cursor-pointer rounded-md px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:text-ink">
                Total Points
            </button>
        </div>

        <!-- Interactive Medal Series Toggles -->
        <div class="flex flex-wrap items-center gap-1.5" data-medal-toggles>
            <button type="button" data-toggle-series="0" aria-pressed="true"
                    class="inline-flex cursor-pointer items-center gap-1.5 rounded-full border border-amber-200 bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-900 transition hover:bg-amber-100">
                <span class="h-2.5 w-2.5 rounded-full bg-amber-400"></span>Gold
            </button>
            <button type="button" data-toggle-series="1" aria-pressed="true"
                    class="inline-flex cursor-pointer items-center gap-1.5 rounded-full border border-slate-300 bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700 transition hover:bg-slate-200">
                <span class="h-2.5 w-2.5 rounded-full bg-slate-400"></span>Silver
            </button>
            <button type="button" data-toggle-series="2" aria-pressed="true"
                    class="inline-flex cursor-pointer items-center gap-1.5 rounded-full border border-orange-200 bg-orange-50 px-2.5 py-1 text-xs font-semibold text-orange-900 transition hover:bg-orange-100">
                <span class="h-2.5 w-2.5 rounded-full bg-orange-400"></span>Bronze
            </button>
        </div>

        <!-- Sort control -->
        <div class="flex items-center gap-2">
            <label for="{{ chart_id }}-sort" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Sort</label>
            <select id="{{ chart_id }}-sort" data-chart-sort
                    class="h-8 cursor-pointer rounded-md border border-slate-200 bg-white px-2.5 text-xs font-semibold text-ink outline-none focus:border-pine focus:ring-2 focus:ring-pine/15">
                <option value="rank">Official Rank</option>
                <option value="total">Total Medals</option>
                <option value="gold">Most Gold</option>
                <option value="points">Highest Points</option>
            </select>
        </div>
    </div>

    <!-- Horizontal Interactive Canvas -->
    <div class="relative w-full" data-chart-stage style="height: 280px;">
        <canvas id="{{ chart_id }}" data-medal-chart data-series-id="{{ data_id }}" data-chart-max="{{ chart_max }}"
                role="img" aria-label="Interactive horizontal bar graph of gold, silver and bronze medals per delegation"></canvas>
    </div>

    <!-- Click-to-inspect detail strip -->
    <div data-chart-selection class="hidden flex-wrap items-center justify-between gap-3 rounded-lg border border-pine/20 bg-moss/50 px-4 py-2.5 text-xs">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-ink" data-chart-selection-body></div>
        <button type="button" data-chart-selection-clear class="cursor-pointer font-semibold text-pine hover:underline">Clear</button>
    </div>
</div>
{{ series|json_script:data_id }}
<noscript>
    <ul class="mt-3 space-y-1 text-xs text-slate-600">
        {% for row in series %}
        <li class="flex items-center justify-between gap-3">
            <span class="truncate font-semibold text-slate-700">{{ row.rank }}. {{ row.name }}{% if row.provisional %} (provisional){% endif %}</span>
            <span class="shrink-0 text-slate-500">{{ row.gold }}G &middot; {{ row.silver }}S &middot; {{ row.bronze }}B</span>
        </li>
        {% endfor %}
    </ul>
</noscript>
{% endwith %}
{% else %}
<p class="rounded-md border border-dashed border-slate-200 bg-slate-50/60 px-4 py-8 text-center text-sm text-slate-400">{{ empty_note|default:"No medals yet." }}</p>
{% endif %}
