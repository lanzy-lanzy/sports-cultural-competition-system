{# Cultural sub-type select backed by the DB taxonomy, with inline add/edit/delete of sub-types and their main groups. #}
{# Context: subtype_groups, selected_subtype, is_cultural, can_manage_subtypes, prefix (for pages with several forms). #}
{% with p=prefix|default:'' %}
<div id="{{ p }}subtype-field" class="cultural-subtype-wrap md:col-span-2 rounded-md border border-slate-200 bg-slate-50 p-5 {% if not is_cultural %}hidden{% endif %}">
    <div class="mb-1.5 flex items-center justify-between">
        <label for="{{ p }}cultural_event_type" class="block text-sm font-semibold text-slate-800">Socio Cultural Event <span class="text-rose-500">*</span></label>
    </div>
    <select id="{{ p }}cultural_event_type" name="cultural_event_type" required data-cultural-event-select
            class="mt-1 w-full cursor-pointer rounded-md border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-800 shadow-sm transition focus:border-violet-400 focus:outline-none focus:ring-4 focus:ring-violet-100"
            {% if not is_cultural %}disabled{% endif %}>
        <option value="">Select socio cultural event</option>
        {% for group in subtype_groups %}
        <optgroup label="{{ group.name }}" data-group-id="{{ group.id }}">
            {% for sub in group.subtypes %}
            <option value="{{ sub.slug }}" data-event-name="{{ sub.name }}" data-main-group="{{ group.name }}" {% if sub.slug == selected_subtype %}selected{% endif %}>{{ sub.name }}</option>
            {% endfor %}
        </optgroup>
        {% endfor %}
    </select>
    <div data-cultural-event-meta class="mt-3 hidden rounded-md border border-violet-200 bg-violet-50/70 px-3.5 py-2 text-xs font-semibold text-violet-900"></div>
</div>
<script>
(() => {
    const sel = document.getElementById('{{ p|escapejs }}cultural_event_type');
    if (!sel || sel.dataset.boundCultural) return;
    sel.dataset.boundCultural = '1';
    const wrap = sel.closest('.cultural-subtype-wrap');
    const meta = wrap?.querySelector('[data-cultural-event-meta]');
    const form = sel.closest('form');
    const nameInput = form?.querySelector('input[name="name"]');

    function syncCulturalEvent(fromUserChange = false) {
        const opt = sel.options[sel.selectedIndex];
        const eventName = opt?.dataset.eventName || '';
        const mainGroup = opt?.dataset.mainGroup || '';
        if (meta) {
            if (eventName) {
                meta.textContent = `${mainGroup} · ${eventName}`;
                meta.classList.remove('hidden');
            } else {
                meta.classList.add('hidden');
            }
        }
        if (eventName && nameInput && (fromUserChange || !nameInput.value.trim())) {
            nameInput.value = eventName.toUpperCase();
        }
    }

    sel.addEventListener('change', () => syncCulturalEvent(true));
    syncCulturalEvent(false);
})();
</script>
{% endwith %}
